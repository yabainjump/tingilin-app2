  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f4fc" id="app-theme-color" />
  <script>
    // Applique la preference enregistree avant le bootstrap Angular
    // pour eviter un flash de theme (FOUC).
    (function () {
      var meta = document.getElementById('app-theme-color');
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      function paint(theme) {
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#0d0913' : '#f7f4fc');
        }
      }

      try {
        var stored = localStorage.getItem('tinguilin.theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
          paint(stored);
        } else {
          paint(systemDark ? 'dark' : 'light');
        }
      } catch (e) {
        /* stockage indisponible : on garde le theme systeme */
        paint(systemDark ? 'dark' : 'light');
      }
    })();
  </script>
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
