<ion-content [fullscreen]="true" class="onboarding">
  <div class="screen">
    <header class="top">
      <button
        class="icon-btn"
        type="button"
        [class.hidden]="currentIndex === 0"
        (click)="back()"
        [attr.aria-label]="'COMMON.BACK' | translate"
      >
        <ion-icon name="arrow-back"></ion-icon>
      </button>

      <h1 class="title">{{ 'ONBOARDING_PAGE.TOP_TITLE' | translate }}</h1>

      <button class="skip-btn" type="button" (click)="skip()">{{ 'ONBOARDING_PAGE.SKIP' | translate }}</button>
    </header>

    <div class="card-wrap">
      <div
        class="hero"
        role="img"
        [attr.aria-label]="currentSlideTitle"
        [style.background-image]="'url(' + currentSlide.imageUrl + ')'"
      ></div>
    </div>

    <section class="content">
      <h2>{{ currentSlideTitle }}</h2>
      <p>{{ currentSlideDescription }}</p>
    </section>

    <div class="dots">
      <button
        *ngFor="let _ of slides; let i = index"
        type="button"
        class="dot"
        [class.active]="i === currentIndex"
        [attr.aria-current]="i === currentIndex ? 'step' : null"
        [attr.aria-label]="('ONBOARDING_PAGE.STEP' | translate) + ' ' + (i + 1)"
        (click)="goToSlide(i)"
      ></button>
    </div>

    <footer class="footer">
      <button class="next-btn" type="button" (click)="next()">
        <span>{{ isLast ? ('ONBOARDING_PAGE.START' | translate) : ('ONBOARDING_PAGE.NEXT' | translate) }}</span>
        <ion-icon name="arrow-forward"></ion-icon>
      </button>

      <button
        *ngIf="!isLast"
        class="link-btn"
        type="button"
        (click)="skip()"
      >
        {{ 'ONBOARDING_PAGE.SKIP_INTRO' | translate }}
      </button>
    </footer>
  </div>
</ion-content>
