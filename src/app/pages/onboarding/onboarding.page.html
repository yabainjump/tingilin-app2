<ion-content [fullscreen]="true" class="onboarding">
  <div class="screen">
    <header class="top">
      <button
        class="icon-btn"
        type="button"
        [class.hidden]="currentIndex === 0"
        (click)="back()"
        aria-label="Retour"
      >
        <ion-icon name="arrow-back"></ion-icon>
      </button>

      <h1 class="title">Onboarding</h1>

      <button class="skip-btn" type="button" (click)="skip()">Passer</button>
    </header>

    <div class="card-wrap">
      <div
        class="hero"
        [style.background-image]="'url(' + currentSlide.imageUrl + ')'"
      ></div>
    </div>

    <section class="content">
      <h2>{{ currentSlide.title }}</h2>
      <p>{{ currentSlide.description }}</p>
    </section>

    <div class="dots">
      <button
        *ngFor="let _ of slides; let i = index"
        type="button"
        class="dot"
        [class.active]="i === currentIndex"
        [attr.aria-label]="'Étape ' + (i + 1)"
      ></button>
    </div>

    <footer class="footer">
      <button class="next-btn" type="button" (click)="next()">
        <span>{{ isLast ? 'Commencer' : 'Suivant' }}</span>
        <ion-icon name="arrow-forward"></ion-icon>
      </button>

      <button
        *ngIf="!isLast"
        class="link-btn"
        type="button"
        (click)="skip()"
      >
        Passer l’introduction
      </button>
    </footer>
  </div>
</ion-content>
