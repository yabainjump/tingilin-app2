<ion-content [fullscreen]="true" class="support-page">
  <div class="support-shell">
    <div class="support-glow glow-top" aria-hidden="true"></div>
    <div class="support-glow glow-bottom" aria-hidden="true"></div>

    <header class="support-header">
      <button
        class="back-button"
        type="button"
        (click)="goBack()"
        [attr.aria-label]="'COMMON.BACK' | translate"
      >
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>

      <div class="headline">
        <p class="eyebrow">{{ 'SUPPORT_PAGE.EYEBROW' | translate }}</p>
        <h1>{{ 'SUPPORT_PAGE.TITLE' | translate }}</h1>
        <p class="subtitle">{{ 'SUPPORT_PAGE.SUBTITLE' | translate }}</p>
      </div>
    </header>

    <section class="search-card">
      <ion-icon class="search-icon" name="search-outline"></ion-icon>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        [placeholder]="'SUPPORT_PAGE.SEARCH_PLACEHOLDER' | translate"
        [attr.aria-label]="'SUPPORT_PAGE.SEARCH_PLACEHOLDER' | translate"
      />
    </section>

    <section class="section">
      <div class="section-head">
        <p class="section-kicker">{{ 'SUPPORT_PAGE.CONTACT' | translate }}</p>
      </div>

      <div class="contact-grid">
        <button
          class="contact-card contact-card--primary"
          type="button"
          (click)="contactSupport()"
        >
          <div class="contact-icon tone-violet">
            <ion-icon name="mail-outline"></ion-icon>
          </div>

          <div class="contact-copy">
            <strong>{{ 'SUPPORT_PAGE.CONTACT_WRITE' | translate }}</strong>
            <span>{{ 'SUPPORT_PAGE.CONTACT_WRITE_DESC' | translate }}</span>
          </div>

          <ion-icon class="chevron" name="chevron-forward-outline"></ion-icon>
        </button>

        <button class="contact-card" type="button" (click)="scrollToFaqs()">
          <div class="contact-icon tone-blue">
            <ion-icon name="book-outline"></ion-icon>
          </div>

          <div class="contact-copy">
            <strong>{{ 'SUPPORT_PAGE.CONTACT_FAQ' | translate }}</strong>
            <span>{{ 'SUPPORT_PAGE.CONTACT_FAQ_DESC' | translate }}</span>
          </div>
        </button>
      </div>
    </section>

    <section class="section">
      <div class="section-head section-head--center">
        <p class="section-kicker">
          {{ 'SUPPORT_PAGE.CATEGORIES' | translate }}
        </p>
      </div>

      <div class="category-grid">
        <button
          *ngFor="let category of categories; trackBy: trackByCategory"
          type="button"
          class="category-card"
          [class.active]="selectedCategoryId === category.id"
          [attr.aria-pressed]="selectedCategoryId === category.id"
          (click)="selectCategory(category.id)"
        >
          <span class="category-icon" [ngClass]="'tone-' + category.tone">
            <ion-icon [name]="category.icon"></ion-icon>
          </span>
          <span class="category-label">{{ categoryLabel(category.id) }}</span>
        </button>
      </div>
    </section>

    <section id="support-faq" class="section faq-section">
      <div class="section-head">
        <h2>{{ 'SUPPORT_PAGE.FAQ_TITLE' | translate }}</h2>
        <button
          *ngIf="searchTerm || selectedCategoryId !== 'all'"
          type="button"
          class="see-all"
          (click)="resetFilters()"
        >
          {{ 'COMMON.VIEW_ALL' | translate }}
        </button>
      </div>

      <div class="faq-list" *ngIf="visibleFaqs.length; else emptyFaqState">
        <article
          *ngFor="let faq of visibleFaqs; trackBy: trackByFaq"
          class="faq-card"
          [class.open]="isExpanded(faq.id)"
        >
          <button
            class="faq-trigger"
            type="button"
            (click)="toggleFaq(faq.id)"
            [attr.aria-expanded]="isExpanded(faq.id)"
            [attr.aria-controls]="'faq-answer-' + faq.id"
          >
            <div class="faq-meta">
              <span class="faq-chip">{{ labelForCategory(faq.category) }}</span>
              <strong>{{ faqQuestion(faq) }}</strong>
            </div>

            <ion-icon class="arrow" name="chevron-down-outline"></ion-icon>
          </button>

          <div
            class="faq-answer"
            *ngIf="isExpanded(faq.id)"
            [id]="'faq-answer-' + faq.id"
          >
            <p>{{ faqAnswer(faq) }}</p>

            <button
              class="inline-support"
              type="button"
              (click)="contactSupport(faq.category)"
            >
              {{ 'SUPPORT_PAGE.CONTACT_THIS_TOPIC' | translate }}
            </button>
          </div>
        </article>
      </div>

      <ng-template #emptyFaqState>
        <app-empty-state
          icon="help-buoy-outline"
          [compact]="true"
          [title]="'SUPPORT_PAGE.EMPTY_TITLE' | translate"
          [description]="'SUPPORT_PAGE.EMPTY_DESC' | translate"
          [actionLabel]="'SUPPORT_PAGE.RESET' | translate"
          (action)="resetFilters()"
        ></app-empty-state>
      </ng-template>
    </section>
  </div>
</ion-content>
