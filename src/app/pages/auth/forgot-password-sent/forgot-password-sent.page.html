<ion-content [fullscreen]="true" class="sent">
  <div class="top-line"></div>

  <div class="wrap">
    <div class="icon-area">
      <div class="icon-glow"></div>

      <div class="icon-circle">
        <span class="material-symbols-outlined mail">password</span>
      </div>
    </div>

    <div class="text">
      <h1>Réinitialiser le mot de passe</h1>
      <p>
        Entrez le code reçu par email et définissez votre nouveau mot de passe.
      </p>
      <p class="identifier" *ngIf="identifier">{{ identifier }}</p>
    </div>

    <form class="form" (ngSubmit)="submit()">
      <input
        class="input"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Code de vérification"
        [formControl]="form.controls.code"
      />

      <input
        class="input"
        type="password"
        autocomplete="new-password"
        placeholder="Nouveau mot de passe"
        [formControl]="form.controls.newPassword"
      />

      <input
        class="input"
        type="password"
        autocomplete="new-password"
        placeholder="Confirmer le mot de passe"
        [formControl]="form.controls.confirmPassword"
      />

      <button class="primary" type="submit" [disabled]="loading">
        <span class="label" *ngIf="!loading">Valider la réinitialisation</span>
        <ion-skeleton-text *ngIf="loading" animated class="btn-skeleton"></ion-skeleton-text>
        <div class="shimmer"></div>
      </button>
    </form>

    <div class="timer">
      <span class="material-symbols-outlined">timer</span>
      <div>
        Renvoyer le code dans
        <span class="nums">{{ mmss }}</span>
      </div>
    </div>

    <button
      class="link-btn"
      type="button"
      [disabled]="secondsLeft > 0 || resending"
      (click)="resend()"
    >
      {{ resending ? 'Envoi en cours...' : 'Renvoyer le code' }}
    </button>
  </div>

  <div class="footer">
    <button class="footer-btn" type="button" (click)="backToLogin()">
      <span class="material-symbols-outlined">arrow_back</span>
      Retour à la connexion
    </button>
  </div>

  <div class="blob a"></div>
  <div class="blob b"></div>
</ion-content>
