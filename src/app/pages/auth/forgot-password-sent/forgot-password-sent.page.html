<ion-content [fullscreen]="true" class="sent">
  <div class="top-line"></div>

  <div class="wrap">
    <!-- Icon -->
    <div class="icon-area">
      <div class="icon-glow"></div>

      <div class="icon-circle">
        <span class="material-symbols-outlined mail">mail</span>

        <div class="badge">
          <div class="badge-green">
            <span class="material-symbols-outlined check">check</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Text -->
    <div class="text">
      <h1>Vérifiez votre boîte de réception</h1>
      <p>
        Nous avons envoyé un lien de réinitialisation de mot de passe à votre adresse email.
      </p>
    </div>

    <!-- Primary Action -->
    <button class="primary" type="button" (click)="openMailApp()">
      <span class="label">Ouvrir mon application mail</span>
      <div class="shimmer"></div>
    </button>

    <!-- Timer -->
    <div class="timer">
      <span class="material-symbols-outlined">timer</span>
      <div>
        Renvoyer le code dans
        <span class="nums">{{ mmss }}</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="footer-btn" type="button" (click)="backToLogin()">
      <span class="material-symbols-outlined">arrow_back</span>
      Retour à la connexion
    </button>
  </div>

  <!-- Background blobs -->
  <div class="blob a"></div>
  <div class="blob b"></div>
</ion-content>
