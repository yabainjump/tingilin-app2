<ion-content [fullscreen]="true" class="login">
  <!-- Back -->
  <div class="topbar">
    <button
      class="icon-btn"
      routerLink="/landing"
      [attr.aria-label]="'COMMON.BACK' | translate"
    >
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
  </div>

  <div class="wrap">
    <div class="head">
      <div class="logo">
        <span><img src="../../../../assets/img/Asset_7.png" alt="" /></span>
      </div>

      <h1>{{ 'LOGIN_PAGE.TITLE' | translate }}</h1>
      <p>
        {{ 'LOGIN_PAGE.SUBTITLE' | translate }}
        <span class="gold">100 FCFA</span>.
      </p>
    </div>

    <div class="card">
      <div class="field">
        <label>{{ 'LOGIN_PAGE.IDENTIFIER' | translate }}</label>
        <div class="input">
          <ion-icon class="left" name="mail-outline"></ion-icon>
          <input
            type="text"
            [placeholder]="'LOGIN_PAGE.IDENTIFIER_PLACEHOLDER' | translate"
            [formControl]="form.controls.identifier"
          />
        </div>
      </div>

      <div class="field">
        <div class="row">
          <label>{{ 'LOGIN_PAGE.PASSWORD_LABEL' | translate }}</label>
          <a class="link" routerLink="/auth/forgot-password"
            >{{ 'LOGIN_PAGE.FORGOT' | translate }}</a
          >
        </div>

        <div class="input">
          <ion-icon class="left" name="lock-closed-outline"></ion-icon>
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [formControl]="form.controls.password"
          />
          <button
            type="button"
            class="eye"
            (click)="togglePassword()"
            [attr.aria-label]="'LOGIN_PAGE.TOGGLE_PASSWORD' | translate"
          >
            <ion-icon
              [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
            ></ion-icon>
          </button>
        </div>
      </div>

      <button class="cta" (click)="submit()" [disabled]="loading">
        <span *ngIf="!loading">{{ 'LOGIN_PAGE.SUBMIT' | translate }}</span>
        <ion-skeleton-text
          *ngIf="loading"
          animated
          class="btn-skeleton"
        ></ion-skeleton-text>
      </button>
    </div>

    <div class="social">
      <div class="sep">
        <div class="line"></div>
        <div class="txt">{{ 'LOGIN_PAGE.OR_CONTINUE' | translate }}</div>
        <div class="line"></div>
      </div>

<button
        class="google-btn"
        type="button"
        (click)="signInWithGoogle()"
        [disabled]="googleLoading"
      >
        <svg class="gsvg" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span *ngIf="!googleLoading">{{ 'LOGIN_PAGE.GOOGLE_SIGNIN' | translate }}</span>
        <ion-spinner *ngIf="googleLoading" name="crescent"></ion-spinner>
      </button>
    </div>

    <div class="foot">
      <span>{{ 'LOGIN_PAGE.NEW_HERE' | translate }}</span>
      <a routerLink="/auth/register"
        >{{ 'LOGIN_PAGE.CREATE_ACCOUNT' | translate }}</a
      >
    </div>
  </div>
</ion-content>
