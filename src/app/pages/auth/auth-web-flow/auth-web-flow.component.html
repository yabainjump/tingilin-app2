<section class="auth-web-flow">
  <h2 class="heading">Continuer avec Google</h2>
  <p class="subtitle">Connectez-vous rapidement avec votre compte Google</p>
  
  <!-- Google button rendered by GIS -->
  <div id="google-signin-button" class="google-btn-container mb-24"></div>
  
  <!-- Fallback: manual idToken input (for debugging/testing) -->
  <div class="form-group">
    <label for="region">Ta région (obligatoire)</label>
    <ion-select 
      placeholder="Sélectionne ta région" 
      [(ngModel)]="form.value.region"
      [ngModel]="$any(form.get('region'))"
      interface="action-sheet">
      <ion-option value="">Toute la Cameroon</ion-option>
      <ion-option value="CENTRE">Centre (Yaoundé)</ion-option>
      <ion-option value="LITTORAL">Littoral (Douala)</ion-option>
      <ion-option value="OUEST">Ouest (Bafoussam)</ion-option>
      <ion-option value="SUD_OUEST">Sud-Ouest (Buéa, Limbé)</ion-option>
    </ion-select>
  </div>

  <ion-button 
    expand="block" 
    class="btn-secondary"
    (click)="form.get('region').markAsTouched()"
    [disabled]="form.get('region').invalid">
    Continuer
  </ion-button>
  
  <p class="footer-text">
    En continuant, vous acceptez nos Conditions d'utilisation et notre Politique de confidentialité.
  </p>
</section>
