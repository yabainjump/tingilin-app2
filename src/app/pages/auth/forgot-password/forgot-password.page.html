<ion-content [fullscreen]="true" class="fp">
  <!-- Top Navigation -->
  <div class="top">
    <button class="top-btn" type="button" (click)="backToLogin()" [attr.aria-label]="'COMMON.BACK' | translate">
      <span class="notranslate material-symbols-outlined">arrow_back</span>
    </button>

    <div class="top-title">{{ 'FORGOT_PASSWORD_PAGE.TOP_TITLE' | translate }}</div>
    <div class="top-spacer"></div>
  </div>

  <main class="main">
    <!-- Illustration -->
    <div class="illus">
      <div class="illus-wrap">
        <div class="illus-glow"></div>
        <div class="illus-img"
          style="background-image:url('https://lh3.googleusercontent.com/aida-public/AB6AXuBnM3RErFGWZxoCdz4WgvLP993cElUT_nWqP5lfKEn-zdrw5Qiy0Z02fUhvHyICdGznwFrN6FqDgKZzFfWMs_u0y6_odQtKXqZu0q7Uyl6AcK54gitUj-AJwY5z8q_Kv6XU2VgAO-JTEQ6fVDJTxzDVSNftPC6vL_MO01p-T9zrEygvPYfeB2h-3i_iJfgiz9Gg88zH-m5f3UdSU1oMJLcFKAjG_WIOnH59f8Sd2-Gs0TJh7DKwgqeFjd6UypYmEHV-5VSZH5ywxd0')">
        </div>
      </div>
    </div>

    <!-- Headline -->
    <div class="headline">
      <h1>{{ 'FORGOT_PASSWORD_PAGE.TITLE' | translate }}</h1>
      <p>
        {{ 'FORGOT_PASSWORD_PAGE.SUBTITLE' | translate }}
      </p>
    </div>

    <!-- Form -->
    <form class="form" (ngSubmit)="submit()">
      <div class="field">
        <div class="focus-glow"></div>

        <div class="input-wrap">
          <div class="icon">
            <span class="notranslate material-symbols-outlined">mail</span>
          </div>

          <input type="text" [placeholder]="'FORGOT_PASSWORD_PAGE.IDENTIFIER_PLACEHOLDER' | translate" [formControl]="form.controls.identifier"
            autocomplete="email" />
        </div>
      </div>

      <button class="cta" type="submit" [disabled]="loading">
        <div class="cta-bg"></div>

        <div class="cta-inner">
          <span class="cta-text">{{ 'FORGOT_PASSWORD_PAGE.SEND_CODE' | translate }}</span>
          <span class="notranslate material-symbols-outlined send-ico">send</span>
        </div>

        <div class="cta-glow"></div>

        <div class="cta-loading" *ngIf="loading">
          <ion-skeleton-text animated class="btn-skeleton"></ion-skeleton-text>
        </div>
      </button>
    </form>

    <div class="bottom">
      <button class="back-link" type="button" (click)="backToLogin()">
        <span class="notranslate material-symbols-outlined">chevron_left</span>
        {{ 'FORGOT_PASSWORD_PAGE.BACK_TO_LOGIN' | translate }}
      </button>
    </div>
  </main>
</ion-content>
