<ion-content [fullscreen]="true" class="fp">
  <!-- Top Navigation -->
  <div class="top">
    <button class="top-btn" type="button" (click)="backToLogin()" aria-label="Retour">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="top-title">Réinitialisation</div>
    <div class="top-spacer"></div>
  </div>

  <main class="main">
    <!-- Illustration -->
    <div class="illus">
      <div class="illus-wrap">
        <div class="illus-glow"></div>
        <div class="illus-img"
          style="background-image:url('https://lh3.googleusercontent.com/aida-public/AB6AXuBnM3RErFGWZxoCdz4WgvLP993cElUT_nWqP5lfKEn-zdrw5Qiy0Z02fUhvHyICdGznwFrN6FqDgKZzFfWMs_u0y6_odQtKXqZu0q7Uyl6AcK54gitUj-AJwY5z8q_Kv6XU2VgAO-JTEQ6fVDJTxzDVSNftPC6vL_MO01p-T9zrEygvPYfeB2h-3i_iJfgiz9Gg88zH-m5f3UdSU1oMJLcFKAjG_WIOnH59f8Sd2-Gs0TJh7DKwgqeFjd6UypYmEHV-5VSZH5ywxd0')">
        </div>
      </div>
    </div>

    <!-- Headline -->
    <div class="headline">
      <h1>Mot de passe oublié ?</h1>
      <p>
        Entrez votre adresse email ou numéro de téléphone pour recevoir un code de réinitialisation.
      </p>
    </div>

    <!-- Form -->
    <form class="form" (ngSubmit)="submit()">
      <div class="field">
        <div class="focus-glow"></div>

        <div class="input-wrap">
          <div class="icon">
            <span class="material-symbols-outlined">mail</span>
          </div>

          <input type="text" placeholder="Email ou Numéro" [formControl]="form.controls.identifier"
            autocomplete="email" />
        </div>
      </div>

      <button class="cta" type="submit" [disabled]="loading">
        <div class="cta-bg"></div>

        <div class="cta-inner">
          <span class="cta-text">Envoyer le code</span>
          <span class="material-symbols-outlined send-ico">send</span>
        </div>

        <div class="cta-glow"></div>

        <div class="cta-loading" *ngIf="loading">
          <ion-spinner name="crescent"></ion-spinner>
        </div>
      </button>
    </form>

    <div class="bottom">
      <button class="back-link" type="button" (click)="backToLogin()">
        <span class="material-symbols-outlined">chevron_left</span>
        Retour à la connexion
      </button>
    </div>
  </main>
</ion-content>
