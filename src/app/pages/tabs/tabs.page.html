<ion-tabs>

  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom" class="lotto-tabbar">
    <ion-tab-button tab="home">
      <span class="material-symbols-outlined">home</span>
      <ion-label>Accueil</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="participations" href="/tabs/participations">
      <ion-icon name="ticket-outline"></ion-icon>
      <ion-label>Loterie</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="referral" href="/tabs/referral">
      <span class="material-symbols-outlined">redeem</span>
      <ion-label>Parrainage</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <span class="material-symbols-outlined">person</span>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>


  <ion-fab *ngIf="isAdmin" class="center-fab" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="goCreateRaffle()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>


</ion-tabs>
